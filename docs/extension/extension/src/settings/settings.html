<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Charset Switcher Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 30px; font-size: 24px; }
    .section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
    .section h2 { font-size: 16px; color: #333; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #4CAF50; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; color: #333; }
    .input-group { display: flex; gap: 10px; align-items: flex-end; }
    .input-group input { flex: 1; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-primary { background-color: #4CAF50; color: #fff; }
    .btn-danger { background-color: #f44336; color: #fff; padding: 4px 8px; font-size: 12px; }
    .charset-list { list-style: none; }
    .charset-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f9f9f9; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #4CAF50; }
    .charset-item.custom { border-left-color: #2196F3; }
    .charset-item-value { font-weight: 500; color: #333; font-size: 13px; }
    .charset-item-label { font-size: 12px; color: #666; margin-top: 2px; }
    .message { padding: 12px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; }
    .message.error { background-color: #ffebee; color: #c62828; border: 1px solid #ef5350; }
    .message.success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #81c784; }
    .note { font-size: 12px; color: #666; margin-top: 10px; padding: 10px; background-color: #f5f5f5; border-radius: 4px; }
    @media (max-width: 600px) { .input-group { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="settingsTitle">Charset Switcher Settings</h1>
    <div id="message"></div>

    <div class="section">
      <h2 data-i18n="settingsBasic">Basic settings</h2>
      <div class="form-group">
        <label for="defaultCharset" data-i18n="settingsDefaultCharset">Default charset</label>
        <select id="defaultCharset"><option value="UTF-8">UTF-8</option></select>
      </div>
      <div class="note" data-i18n="settingsDefaultNote"></div>
    </div>

    <div class="section">
      <h2 data-i18n="settingsCharsetList">Charset list</h2>

      <div class="form-group">
        <label data-i18n="settingsBuiltInCharsets">Built-in charsets</label>
        <ul id="defaultCharsetList" class="charset-list"></ul>
      </div>

      <div style="margin: 20px 0; padding: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee;">
        <h3 style="font-size: 14px; color: #333; margin-bottom: 15px;" data-i18n="settingsAddCustomCharset">Add custom charset</h3>
        <div class="input-group" style="margin-bottom: 10px;">
          <input type="text" id="charsetValue" data-i18n-placeholder="settingsCharsetValuePlaceholder">
          <input type="text" id="charsetLabel" data-i18n-placeholder="settingsCharsetLabelPlaceholder">
          <button class="btn btn-primary" id="addBtn" data-i18n="settingsAdd">Add</button>
        </div>
      </div>

      <div class="form-group">
        <label data-i18n="settingsCustomCharsets">Custom charsets</label>
        <ul id="customCharsetList" class="charset-list"></ul>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="settingsSiteSettings">Site settings</h2>
      <div class="form-group">
        <label data-i18n="settingsConfiguredDomains">Configured domains</label>
        <ul id="siteList" class="charset-list"></ul>
      </div>
      <div class="note" data-i18n="settingsSiteNote"></div>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
