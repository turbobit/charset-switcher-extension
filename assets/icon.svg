<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>

  <!-- Letter A -->
  <g transform="translate(20, 20)">
    <!-- Left stroke of A -->
    <line x1="22" y1="70" x2="2" y2="0" stroke="white" stroke-width="6" stroke-linecap="round"/>

    <!-- Right stroke of A -->
    <line x1="22" y1="70" x2="42" y2="0" stroke="white" stroke-width="6" stroke-linecap="round"/>

    <!-- Horizontal bar of A -->
    <line x1="8" y1="45" x2="36" y2="45" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Encoding symbol (two arrows) -->
  <g transform="translate(70, 40)">
    <!-- Top arrow pointing down -->
    <path d="M 20 0 L 20 25 M 16 21 L 20 25 L 24 21"
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom arrow pointing up -->
    <path d="M 20 35 L 20 60 M 16 39 L 20 35 L 24 39"
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
